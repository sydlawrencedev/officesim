[package]
name = "officesim"
version = "0.1.0"
description = "OfficeSim for Mac: a pixel office of the AI agents running on this machine"
edition = "2021"
publish = false

[lib]
name = "officesim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.7.0"
libc = "0.2.189"
rusqlite = { version = "0.40.2", features = ["bundled"] }
postgres = "0.19.14"
ureq = { version = "3.4.2", default-features = false, features = ["json"] }
md5 = "0.8.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-autostart = "2.7.0"
